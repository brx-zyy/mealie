name: Security proof - FlareSolverr browser SSRF

on:
  push:
    branches:
      - security/flaresolverr-ssrf-live-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end-mealie-ssrf-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated Docker network and mock endpoints
        run: |
          set -eux
          docker network create ssrf-proof
          docker run -d --name proof-mock --network ssrf-proof \
            --network-alias attacker-proof --network-alias internal-proof \
            -v "$GITHUB_WORKSPACE/.github/security-proof/mock_server.py:/mock_server.py:ro" \
            python:3.12-alpine python /mock_server.py

      - name: Start FlareSolverr
        run: |
          docker run -d --name proof-flaresolverr --network ssrf-proof \
            -p 8191:8191 -e LOG_LEVEL=info flaresolverr/flaresolverr:latest
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8191/ >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8191/ >/dev/null

      - name: Build Mealie production image from this commit
        run: docker build --target production -f docker/Dockerfile -t mealie-ssrf-proof .

      - name: Run authenticated recipe-import integration test
        run: |
          set -eux
          docker run --rm --name proof-mealie --network ssrf-proof \
            --entrypoint /bin/sh \
            -e PRODUCTION=true \
            -e TESTING=true \
            -e ALLOW_SIGNUP=true \
            -e SECRET=proof-secret-not-for-production \
            -e SESSION_SECRET=proof-session-secret-not-for-production \
            -e DB_ENGINE=sqlite \
            -e HTTP_ALLOW_LIST=attacker-proof \
            -e SCRAPER_FLARESOLVERR_URL=http://proof-flaresolverr:8191 \
            -e SCRAPER_FLARESOLVERR_TIMEOUT=60 \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            mealie-ssrf-proof -c 'pip install pytest && python -m pytest -q -s tests/integration_tests/user_recipe_tests/test_flaresolverr_ssrf.py'
          docker logs proof-mock 2>&1 | tee /tmp/mock.log
          grep -q 'GET /challenge' /tmp/mock.log
          grep -q 'PRIVATE_PROOF_REQUEST_RECEIVED path=/proof' /tmp/mock.log

      - name: Cleanup
        if: always()
        run: |
          docker rm -f proof-flaresolverr proof-mock proof-mealie || true
          docker network rm ssrf-proof || true
